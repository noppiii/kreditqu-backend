server:
  port: 8089

spring:
  application:
    name: notification-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@creditqu.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

notification:
  email:
    from: ${MAIL_FROM:noreply@creditqu.com}
  push:
    enabled: false
    firebase:
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

logging:
  level:
    com.creditqu.notification_service: DEBUG